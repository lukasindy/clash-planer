# Einstellungen für den Clash-of-Clans-Upgrade-Planer
# Namen von Gebäuden/Truppen bitte auf Englisch (so heißen sie in den Spieldaten).

timezone = "Europe/Vienna"
village_file = "data/village.json"

[schedule]
# Schlafensplanung: der Planer weiß, dass du nachts nichts starten kannst,
# und wählt Upgrades so, dass sie möglichst nicht mitten in der Nacht fertig werden.
sleep_aware = true
sleep_start = "23:00"
sleep_end = "07:00"

[boosts]
# Goldpass-Boost in Prozent. Senkt laut Supercell Bauzeit UND Kosten (gilt auch fürs Begleiterhaus).
# Gilt für Upgrades, die ab dann STARTEN – laufende bleiben unverändert.

# Monatsstaffel (jede Saison neu): [Tag im Monat, Prozent]
[boosts.monthly]
steps = [[1, 10], [4, 15], [8, 20]]
queues = ["builder", "lab", "pets"]

# Ausnahmen / Events (überschreiben die Staffel), z. B. Hammer Jam:
# [[boosts.schedule]]
# from = "2026-12-01"
# until = "2026-12-16"
# builder = 50
# lab = 50

[notify]
# Plan-folgen-Modus: Nach jeder Benachrichtigung geht das Repo davon aus, dass du die
# Empfehlung startest, und rechnet selbst weiter. Neuer Export nur, wenn du abweichst.
follow_plan = true
# Vorwarnung X Minuten bevor etwas frei wird (0 = aus).
soon_minutes = 60
# Die "ist frei"-Meldung kommt, wenn der Timer abgelaufen ist (+ X Minuten früher, falls gewünscht).
ahead_minutes = 0
# Erinnerung, wenn etwas weiter untätig ist (0 = aus).
reminder_hours = 0
# Erinnerung an einen Abgleich-Export nach so vielen Tagen (0 = aus).
stale_export_days = 7
# Auch nachts benachrichtigen (true = Meldungen in der Schlafenszeit bis zum Aufwachen zurückhalten)
quiet_at_night = false
# Was überwacht werden soll
builders = true
lab = true
pets = true

[planner]
include_townhall = false        # Rathaus nur einplanen, wenn true (kommt dann ganz zum Schluss)
include_new_buildings = true    # noch nicht gebaute Gebäude/Fallen einplanen
steps_shown = 25                # wie viele Schritte pro Warteschlange in PLAN.md
horizon_days = 730

# Reihenfolge fürs Labor (englische Namen). Diese kommen zuerst, in dieser Reihenfolge.
# Alles andere danach, kürzeste Forschungen zuerst.
lab_priority = []
# Beispiel: lab_priority = ["Electro Dragon", "Balloon", "Rage Spell", "Freeze Spell", "Battle Blimp"]

# Reihenfolge fürs Begleiterhaus (englische Namen).
pet_priority = ["Spirit Fox", "Electro Owl", "Unicorn", "L.A.S.S.I", "Frosty", "Angry Jelly",
                "Phoenix", "Mighty Yak", "Diggy", "Poison Lizard", "Sneezy", "Greedy Raven"]

# Prioritätsstufe pro Gebäude für die Bauarbeiter (1 = zuerst). Innerhalb einer Stufe:
# neue Gebäude zuerst, dann die längsten Upgrades (hält die Bauarbeiter am längsten beschäftigt).
default_tier = 4

[planner.tiers]
"Laboratory" = 1
"Clan Castle" = 1
"Army Camp" = 1
"Pet House" = 1
"Blacksmith" = 1
"Hero Hall" = 1
"Spell Factory" = 1
"Dark Spell Factory" = 1
"Workshop" = 1
"Barracks" = 2
"Dark Barracks" = 2
"Squad Barracks" = 2
# Helden (nie während der CWL, siehe [planner.cwl])
# Mains = wichtig (Stufe 3), Rest = niedrig (Stufe 5)
"Archer Queen" = 3
"Dragon Duke" = 3
"Minion Prince" = 3
"Grand Warden" = 3
"Barbarian King" = 5
"Royal Champion" = 5
# Wichtige Verteidigung
"Eagle Artillery" = 3
"Scattershot" = 3
"Inferno Tower" = 3
"Monolith" = 3
"Spell Tower" = 3
"X-Bow" = 3
"Multi-Archer Tower" = 3
"Ricochet Cannon" = 3
"Firespitter" = 3
"Multi-Gear Tower" = 3
"Super Wizard Tower" = 3
"Revenge Tower" = 3
"Air Defense" = 3
"Spiky Tower" = 3
"Firecracker Tower" = 3
"Longshot" = 3
# Rest der Verteidigung, Lager, Hütten = default_tier (4)
# Fallen
"Bomb" = 6
"Spring Trap" = 6
"Air Bomb" = 6
"Giant Bomb" = 6
"Seeking Air Mine" = 6
"Skeleton Trap" = 6
"Tornado Trap" = 6
"Giga Bomb" = 6
# Sammler zuletzt
"Elixir Collector" = 7
"Gold Mine" = 7
"Dark Elixir Drill" = 7
"Town Hall" = 9

# CWL: Helden werden nur so eingeplant, dass sie NICHT während der Clankriegsliga im Upgrade sind
# (vom start_day bis einschließlich end_day jedes Monats).
[planner.cwl]
heroes_blocked = true
start_day = 1
end_day = 11

# Bücher am Monatsanfang: Ein Bauarbeiter und das Labor werden so geplant, dass sie am Bücher-Tag
# (zur Aufwachzeit) frei sind. Dann werden die längsten Upgrades mit Buch sofort fertig gemacht.
[planner.books]
enabled = true
day = 1
builder = 1     # Buch des Bauens
lab = 2         # Labor-Bücher (Kampf/Zauber)
heroes = 1      # Buch der Helden
# Deine Wünsche für den NÄCHSTEN Bücher-Tag (deutsch oder englisch, in Wunschreihenfolge).
# Leer = automatisch das längste Upgrade. Erfüllte Wünsche werden danach automatisch entfernt.
builder_picks = ["Clanburg"]     # z. B. ["Adlerartillerie"]
lab_picks = ["Drache", "Dragon Rider"]     # z. B. ["Elektrodrache", "Ballon"]
heroes_picks = ["Royal Champion"]     # z. B. ["Bogenschützenkönigin"]

# Hämmer, die du gerade hast. Sie werden am nächsten Bücher-Tag eingeplant und danach
# automatisch abgezogen. Ziel optional (sonst das längste/teuerste Upgrade, Hämmer sind gratis).
[hammers]
building = 0     # Hammer des Bauens
heroes = 0     # Hammer der Helden
fighting = 1     # Hammer des Kampfes (Truppen/Belagerung)
spells = 0     # Hammer der Zauber
building_pick = ""
heroes_pick = ""
fighting_pick = "Magier"
spells_pick = ""
