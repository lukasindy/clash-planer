name: Icons aktualisieren

# Holt einmal im Monat (oder per Knopfdruck) die Icons neuer Gebäude/Truppen aus dem Clash-of-Clans-Wiki.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coc-state
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m coc icons
          python -m coc plan > /dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/ PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "Icons aktualisiert"
            git pull --rebase --autostash
            git push
          fi
