name: Export importieren

# Neues Issue mit deinem Dorf-Export als Text → Export wird gespeichert, PLAN.md neu berechnet,
# das Issue bekommt eine Zusammenfassung als Kommentar und wird geschlossen.
# Funktioniert bequem in der GitHub-App am Handy. Nur Issues vom Repo-Besitzer werden verarbeitet.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: coc-state
  cancel-in-progress: false

jobs:
  import:
    if: github.event.issue.author_association == 'OWNER' && contains(github.event.issue.body, '"timestamp"')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: gamedata-${{ steps.week.outputs.week }}
          restore-keys: gamedata-

      - name: Export übernehmen & Plan berechnen
        id: imp
        run: python -m coc import-issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Sofort prüfen (freie Bauarbeiter usw. melden)
        if: success()
        run: python -m coc check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Speichern
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ state/ PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "Neuer Dorf-Export (Issue #${{ github.event.issue.number }})"
            git pull --rebase --autostash
            git push
          fi

      - name: Antwort ins Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f issue_comment.md ]; then
            gh issue comment "$NUMBER" --body-file issue_comment.md
          fi
          if [ "${{ steps.imp.outcome }}" = "success" ]; then
            gh issue close "$NUMBER"
          fi
