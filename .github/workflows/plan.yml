name: Plan neu berechnen

# Läuft, wenn du data/village.json oder config.toml direkt änderst, oder per Knopfdruck.
on:
  push:
    paths:
      - data/village.json
      - config.toml
      - coc/**
      - docs/index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coc-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: gamedata-${{ steps.week.outputs.week }}
          restore-keys: gamedata-

      - run: python -m coc plan

      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md docs/
          if ! git diff --cached --quiet; then
            git commit -m "PLAN.md aktualisiert"
            git pull --rebase --autostash
            git push
          fi
