name: Einstellungen übernehmen

# Wird von der Web-App ausgelöst (Formular "Bücher-Tag & Hämmer"): Issue mit {"coc_settings": …}
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: coc-state
  cancel-in-progress: false

jobs:
  settings:
    if: github.event.issue.author_association == 'OWNER' && contains(github.event.issue.body, '"coc_settings"')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: gamedata-${{ steps.week.outputs.week }}
          restore-keys: gamedata-

      - name: Einstellungen übernehmen & Plan neu berechnen
        id: set
        run: |
          python -m coc settings-issue
          python -m coc plan > /dev/null
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Speichern
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add config.toml PLAN.md docs/
          if ! git diff --cached --quiet; then
            git commit -m "Bücher-Tag-Einstellungen aus der Web-App (Issue #${{ github.event.issue.number }})"
            git pull --rebase --autostash
            git push
          fi

      - name: Antwort ins Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f issue_comment.md ]; then
            gh issue comment "$NUMBER" --body-file issue_comment.md
          fi
          if [ "${{ steps.set.outcome }}" = "success" ]; then
            gh issue close "$NUMBER"
          fi
