name: Timer-Check

# Prüft regelmäßig, ob Bauarbeiter, Labor oder Begleiterhaus frei sind, und schickt eine
# Benachrichtigung. Privates Repo: alle 30 Min. passt ins Gratis-Kontingent (2000 Min./Monat).
# Öffentliches Repo: unbegrenzt, du kannst z. B. "*/10 * * * *" eintragen.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coc-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache
          key: gamedata-${{ steps.week.outputs.week }}
          restore-keys: gamedata-

      - name: Prüfen & benachrichtigen
        run: python -m coc check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Gemerkte Benachrichtigungen speichern (+ Web-App aktualisieren)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            # Status hat sich geändert (z. B. angenommene Upgrades) → Plan & Web-App neu
            python -m coc plan > /dev/null
            git add PLAN.md docs/
            git commit -m "Benachrichtigungsstatus aktualisiert"
            git pull --rebase --autostash
            git push
          fi
